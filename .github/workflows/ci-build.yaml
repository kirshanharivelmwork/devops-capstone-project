name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Legacy nose 1.3.7 needs Python 3.9 (removed standard-library APIs in 3.10+).
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8 service tests
      - name: Run Accounts service tests with nosetests
        run: nosetests -v tests
      - name: Run Accounts service tests with pytest
        run: python -m pytest -v tests
