apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: accounts-cd-run
  labels:
    app: accounts-service
    project: ibm-devops-capstone
spec:
  pipelineRef:
    name: accounts-cd
  taskRunTemplate:
    serviceAccountName: accounts-pipeline
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  timeouts:
    pipeline: "12m"
