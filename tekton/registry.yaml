apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-registry
  template:
    metadata:
      labels:
        app: accounts-registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector:
    app: accounts-registry
  ports:
    - port: 5000
      targetPort: 5000
