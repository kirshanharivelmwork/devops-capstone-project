# Real in-cluster continuous delivery pipeline for the Customer Accounts API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: accounts-pipeline-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accounts-pipeline-deployer
subjects:
  - kind: ServiceAccount
    name: accounts-pipeline
    namespace: default
roleRef:
  kind: Role
  name: accounts-pipeline-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-accounts
spec:
  steps:
    - name: apply
      image: registry.k8s.io/kubectl:v1.32.12
      command: ["kubectl"]
      args: ["apply", "-f", "/manifests/accounts.yaml"]
      volumeMounts:
        - name: manifests
          mountPath: /manifests
  volumes:
    - name: manifests
      configMap:
        name: accounts-deployment-yaml
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-accounts-rollout
spec:
  steps:
    - name: rollout
      image: registry.k8s.io/kubectl:v1.32.12
      command: ["kubectl"]
      args: ["rollout", "status", "deployment/accounts-service", "--timeout=180s"]
    - name: resources
      image: registry.k8s.io/kubectl:v1.32.12
      command: ["kubectl"]
      args: ["get", "deployments,pods,replicasets,services", "-l", "app=accounts-service", "-o", "wide"]
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: smoke-test-accounts
spec:
  steps:
    - name: health
      image: curlimages/curl:8.11.1
      script: |
        #!/bin/sh
        set -eu
        echo "Verifying deployed Accounts health endpoint on port 8080"
        curl --fail --silent --show-error http://accounts-service.default.svc.cluster.local:8080/health
        echo
    - name: list-accounts
      image: curlimages/curl:8.11.1
      script: |
        #!/bin/sh
        set -eu
        echo "Verifying deployed Accounts listing endpoint"
        curl --fail --silent --show-error http://accounts-service.default.svc.cluster.local:8080/accounts
        echo
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clean-accounts-workspace
spec:
  workspaces:
    - name: source
  steps:
    - name: clean
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          rm -rf /workspace/source/repo
          echo "Workspace cleanup completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-accounts-repository
spec:
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      command: ["git"]
      args: ["clone", "--depth=1", "https://github.com/kirshanharivelmwork/devops-capstone-project.git", "/workspace/source/repo"]
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint-accounts-flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          python -m pip install --quiet flake8==7.1.2
          cd /workspace/source/repo
          echo "Running Flake8 on Accounts service and tests"
          flake8 service tests
          echo "Flake8 passed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-accounts-nosetests
spec:
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          cd /workspace/source/repo
          python -m pip install --quiet -r requirements.txt
          echo "Running nosetests on real Accounts API"
          coverage run -m nose -v tests
          coverage report -m
          echo "Nosetests passed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push-accounts-image
spec:
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      command: ["/kaniko/executor"]
      args:
        - "--context=dir:///workspace/source/repo"
        - "--dockerfile=/workspace/source/repo/Dockerfile"
        - "--destination=registry.default.svc.cluster.local:5000/accounts-service:ci"
        - "--insecure"
---
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-cd
spec:
  workspaces:
    - name: source
  tasks:
    - name: workspace-cleanup
      taskRef:
        name: clean-accounts-workspace
      workspaces:
        - name: source
          workspace: source
    - name: repository-clone
      runAfter: ["workspace-cleanup"]
      taskRef:
        name: clone-accounts-repository
      workspaces:
        - name: source
          workspace: source
    - name: flake8-lint
      runAfter: ["repository-clone"]
      taskRef:
        name: lint-accounts-flake8
      workspaces:
        - name: source
          workspace: source
    - name: unit-tests-nosetests
      runAfter: ["flake8-lint"]
      taskRef:
        name: test-accounts-nosetests
      workspaces:
        - name: source
          workspace: source
    - name: image-build-and-push
      runAfter: ["unit-tests-nosetests"]
      taskRef:
        name: build-and-push-accounts-image
      workspaces:
        - name: source
          workspace: source
    - name: deploy
      runAfter: ["image-build-and-push"]
      taskRef:
        name: deploy-accounts
    - name: verify-rollout
      runAfter: ["deploy"]
      taskRef:
        name: check-accounts-rollout
    - name: smoke-test
      runAfter: ["verify-rollout"]
      taskRef:
        name: smoke-test-accounts
